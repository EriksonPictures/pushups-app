<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pushups</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pushups">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { color-scheme: light; }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body { height: 100%; margin: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    background: radial-gradient(circle at 30% 20%, #fbfbfc 0%, #eeeef1 45%, #dfdfe4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  .blob-1 {
    width: 340px; height: 340px;
    background: #c7c7d1;
    top: -100px; left: -80px;
    animation: float1 14s ease-in-out infinite;
  }
  .blob-2 {
    width: 300px; height: 300px;
    background: #d4d4dc;
    bottom: -80px; right: -60px;
    animation: float2 17s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(40px, 60px); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-50px, -30px); }
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    padding: 28px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .top-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .top-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 2px 10px rgba(30,30,40,0.06), inset 0 1px 1px rgba(255,255,255,0.8);
    color: rgba(30,30,35,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .icon-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.75); }

  .date-label {
    color: rgba(30,30,35,0.45);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .reset-btn {
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 2px 10px rgba(30,30,40,0.06), inset 0 1px 1px rgba(255,255,255,0.8);
    color: rgba(30,30,35,0.55);
    font-size: 12px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }
  .reset-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.75); }

  .prompt-wrap {
    width: 100%;
    text-align: center;
    min-height: 20px;
  }
  .prompt-text {
    font-size: 14px;
    font-weight: 600;
    color: rgba(50,50,58,0.55);
    letter-spacing: 0.01em;
  }

  .counter-glass {
    position: relative;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, rgba(255,255,255,0.85), rgba(255,255,255,0.35) 60%);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow:
      0 10px 34px rgba(60,60,75,0.14),
      0 2px 8px rgba(60,60,75,0.08),
      inset 0 1px 2px rgba(255,255,255,0.9),
      inset 0 -14px 26px rgba(180,180,195,0.18);
    transition: transform 0.15s ease;
  }
  .counter-glass::before {
    content: "";
    position: absolute;
    top: 12px; left: 26px;
    width: 76px; height: 32px;
    background: rgba(255,255,255,0.75);
    border-radius: 50%;
    filter: blur(12px);
    transform: rotate(-20deg);
    pointer-events: none;
  }
  .counter-glass.pulse { animation: pulse 0.28s ease; }
  @keyframes pulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  .counter-glass.goal-hit {
    border-color: rgba(255,255,255,1);
    box-shadow:
      0 10px 40px rgba(120,120,140,0.22),
      inset 0 1px 2px rgba(255,255,255,1),
      inset 0 -14px 26px rgba(180,180,195,0.15);
  }

  .count-number {
    font-size: 76px;
    font-weight: 700;
    color: #1c1c1f;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .count-label {
    margin-top: 6px;
    font-size: 13px;
    font-weight: 600;
    color: rgba(30,30,35,0.4);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .pm-row { display: flex; gap: 20px; width: 100%; justify-content: center; }

  .pm-btn {
    width: 84px;
    height: 84px;
    border-radius: 26px;
    border: 1px solid rgba(255,255,255,0.85);
    background: linear-gradient(160deg, rgba(255,255,255,0.75), rgba(255,255,255,0.35));
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 6px 18px rgba(60,60,75,0.12), inset 0 1px 2px rgba(255,255,255,0.9);
    color: #1c1c1f;
    font-size: 36px;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease;
  }
  .pm-btn:active { transform: scale(0.92); background: linear-gradient(160deg, rgba(255,255,255,0.9), rgba(255,255,255,0.5)); }
  .pm-btn.plus {
    background: linear-gradient(160deg, rgba(255,255,255,0.9), rgba(255,255,255,0.5));
    border-color: rgba(255,255,255,1);
  }
  .pm-btn.plus:active { background: linear-gradient(160deg, rgba(255,255,255,1), rgba(255,255,255,0.65)); }

  .quick-row { display: flex; gap: 10px; width: 100%; }

  .quick-btn {
    flex: 1;
    padding: 14px 0;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.75);
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    color: rgba(30,30,35,0.75);
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(60,60,75,0.08), inset 0 1px 1px rgba(255,255,255,0.8);
    transition: transform 0.12s ease, background 0.2s ease;
  }
  .quick-btn:active { transform: scale(0.93); background: rgba(255,255,255,0.7); }

  .goal-wrap { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .goal-track { width: 100%; height: 6px; border-radius: 6px; background: rgba(30,30,40,0.08); overflow: hidden; }
  .goal-fill {
    height: 100%;
    border-radius: 6px;
    background: linear-gradient(90deg, #b0b0b8, #6f6f78);
    transition: width 0.3s ease;
    width: 0%;
  }
  .goal-text { font-size: 12px; color: rgba(30,30,35,0.4); font-weight: 600; text-align: center; }

  .success-overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(245,245,248,0.7);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    padding: 20px;
    text-align: center;
  }
  .success-overlay.show { opacity: 1; pointer-events: auto; }

  .success-msg {
    font-size: 26px;
    font-weight: 700;
    color: #1c1c1f;
    max-width: 300px;
    line-height: 1.3;
    transform: translateY(10px) scale(0.95);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(.2,1.4,.4,1), opacity 0.4s ease;
  }
  .success-overlay.show .success-msg {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .success-tap {
    font-size: 13px;
    color: rgba(30,30,35,0.4);
    font-weight: 600;
  }

  .history-overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(230,230,235,0.75);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 24px 18px;
  }
  .history-overlay.show { opacity: 1; pointer-events: auto; }

  .history-panel {
    width: 100%;
    max-width: 380px;
    max-height: 86vh;
    overflow-y: auto;
    background: linear-gradient(160deg, rgba(255,255,255,0.9), rgba(255,255,255,0.55));
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(50,50,65,0.2), inset 0 1px 2px rgba(255,255,255,0.9);
    padding: 20px 18px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .history-month-label {
    font-size: 16px;
    font-weight: 700;
    color: #1c1c1f;
  }

  .history-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }

  .history-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .history-day-num {
    font-size: 11px;
    font-weight: 600;
    color: rgba(30,30,35,0.4);
  }

  .history-bar-track {
    width: 100%;
    height: 30px;
    border-radius: 8px;
    background: rgba(30,30,40,0.06);
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }

  .history-bar-fill {
    width: 100%;
    border-radius: 8px 8px 0 0;
    background: linear-gradient(180deg, #9a9aa4, #5c5c64);
    transition: height 0.25s ease;
  }

  .history-day-count {
    font-size: 10px;
    font-weight: 600;
    color: rgba(30,30,35,0.35);
  }

  .history-day.empty { visibility: hidden; }

  .history-close {
    margin-top: 4px;
    width: 100%;
    padding: 13px 0;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: rgba(30,30,35,0.7);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease;
  }
  .history-close:active { transform: scale(0.97); background: rgba(255,255,255,0.85); }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: #8f8f98;
    opacity: 0.9;
    animation: burst 1.1s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(0,0) scale(1); opacity: 0.9; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="app">
  <div class="top-row">
    <div class="top-left">
      <button class="icon-btn" id="historyBtn" aria-label="History">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="3"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </button>
      <span class="date-label" id="dateLabel">Today</span>
    </div>
    <button class="reset-btn" id="resetBtn">Reset</button>
  </div>

  <div class="prompt-wrap">
    <div class="prompt-text" id="promptText">Let's get started.</div>
  </div>

  <div class="counter-glass" id="counterGlass">
    <div class="count-number" id="countNumber">0</div>
    <div class="count-label">pushups</div>
  </div>

  <div class="pm-row">
    <div class="pm-btn minus" id="minusBtn">–</div>
    <div class="pm-btn plus" id="plusBtn">+</div>
  </div>

  <div class="quick-row">
    <div class="quick-btn" data-amt="5">+5</div>
    <div class="quick-btn" data-amt="10">+10</div>
    <div class="quick-btn" data-amt="15">+15</div>
    <div class="quick-btn" data-amt="20">+20</div>
  </div>

  <div class="goal-wrap">
    <div class="goal-track"><div class="goal-fill" id="goalFill"></div></div>
    <div class="goal-text" id="goalText">0 / 20 daily goal</div>
  </div>
</div>

<div class="history-overlay" id="historyOverlay">
  <div class="history-panel">
    <div class="history-header">
      <button class="icon-btn" id="monthPrevBtn" aria-label="Previous month">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="history-month-label" id="historyMonthLabel">August 2026</div>
      <button class="icon-btn" id="monthNextBtn" aria-label="Next month">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="history-grid" id="historyGrid"></div>
    <button class="history-close" id="historyCloseBtn">Close</button>
  </div>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-msg" id="successMsg">Erik, you've got it!</div>
  <div class="success-tap">tap to close</div>
</div>

<script>
  const DAILY_GOAL = 20;

  const MESSAGES = [
    "Erik, you've got it!",
    "Goal smashed. Well done, Erik.",
    "That's 20. Strong work.",
    "Erik, consistency wins.",
    "Done for today. Nice discipline.",
    "20 down. That's the standard now.",
    "Erik, that's how it's built.",
    "Goal hit. On to tomorrow."
  ];

  // Rotating prompt above the counter, keyed to progress toward goal.
  const PROMPTS_ZERO = [
    "Let's get started.",
    "First one's the hardest, Erik.",
    "Zero reps. Fix that.",
    "Ready when you are."
  ];
  const PROMPTS_STARTED = [
    "Keep the pace up.",
    "Good start. Don't stop there.",
    "Erik, you're moving.",
    "Building momentum.",
    "Halfway thinking is for later. Move."
  ];
  const PROMPTS_CLOSE = [
    "Almost there, Erik.",
    "Final stretch.",
    "So close. Finish it.",
    "A few more and you're done."
  ];
  const PROMPTS_DONE = [
    "Goal complete. Extra reps still count.",
    "You already won today.",
    "Done. Anything more is a bonus.",
    "Erik, today's in the books."
  ];

  function pickPrompt() {
    let pool;
    if (count <= 0) pool = PROMPTS_ZERO;
    else if (count >= DAILY_GOAL) pool = PROMPTS_DONE;
    else if (count >= DAILY_GOAL * 0.7) pool = PROMPTS_CLOSE;
    else pool = PROMPTS_STARTED;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function todayKey() {
    const d = new Date();
    return `pushups_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function celebratedKey() {
    return todayKey() + '_celebrated';
  }

  function loadCount() {
    const raw = localStorage.getItem(todayKey());
    return raw ? parseInt(raw, 10) : 0;
  }
  function saveCount(n) {
    localStorage.setItem(todayKey(), String(n));
  }

  let count = loadCount();
  let alreadyCelebratedToday = localStorage.getItem(celebratedKey()) === '1';

  const countNumber = document.getElementById('countNumber');
  const counterGlass = document.getElementById('counterGlass');
  const goalFill = document.getElementById('goalFill');
  const goalText = document.getElementById('goalText');
  const dateLabel = document.getElementById('dateLabel');
  const successOverlay = document.getElementById('successOverlay');
  const successMsg = document.getElementById('successMsg');
  const promptText = document.getElementById('promptText');

  function render() {
    countNumber.textContent = count;
    const pct = Math.min(100, (count / DAILY_GOAL) * 100);
    goalFill.style.width = pct + '%';
    goalText.textContent = `${count} / ${DAILY_GOAL} daily goal`;
    counterGlass.classList.toggle('goal-hit', count >= DAILY_GOAL);
    counterGlass.classList.remove('pulse');
    void counterGlass.offsetWidth;
    counterGlass.classList.add('pulse');
    promptText.textContent = pickPrompt();
  }

  function spawnParticles() {
    const rect = counterGlass.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < 24; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = Math.random() * Math.PI * 2;
      const dist = 100 + Math.random() * 140;
      const size = 4 + Math.random() * 6;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      p.style.background = Math.random() > 0.5 ? '#c4c4cc' : '#8f8f98';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1200);
    }
  }

  function celebrate() {
    const msg = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
    successMsg.textContent = msg;
    successOverlay.classList.add('show');
    spawnParticles();
    if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
    localStorage.setItem(celebratedKey(), '1');
    alreadyCelebratedToday = true;
  }

  successOverlay.addEventListener('click', () => {
    successOverlay.classList.remove('show');
  });

  function change(amount) {
    const wasBelow = count < DAILY_GOAL;
    count = Math.max(0, count + amount);
    saveCount(count);
    render();
    if (navigator.vibrate) navigator.vibrate(amount > 0 ? 10 : 15);
    if (wasBelow && count >= DAILY_GOAL && !alreadyCelebratedToday) {
      setTimeout(celebrate, 150);
    }
  }

  document.getElementById('plusBtn').addEventListener('click', () => change(1));
  document.getElementById('minusBtn').addEventListener('click', () => change(-1));
  document.querySelectorAll('.quick-btn').forEach(btn => {
    btn.addEventListener('click', () => change(parseInt(btn.dataset.amt, 10)));
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm("Reset today's count to 0?")) {
      count = 0;
      saveCount(count);
      localStorage.removeItem(celebratedKey());
      alreadyCelebratedToday = false;
      render();
    }
  });

  dateLabel.textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });

  countNumber.textContent = count;
  goalFill.style.width = Math.min(100, (count / DAILY_GOAL) * 100) + '%';
  goalText.textContent = `${count} / ${DAILY_GOAL} daily goal`;
  counterGlass.classList.toggle('goal-hit', count >= DAILY_GOAL);
  promptText.textContent = pickPrompt();

  // ---- history calendar ----
  const historyOverlay = document.getElementById('historyOverlay');
  const historyBtn = document.getElementById('historyBtn');
  const historyCloseBtn = document.getElementById('historyCloseBtn');
  const historyGrid = document.getElementById('historyGrid');
  const historyMonthLabel = document.getElementById('historyMonthLabel');
  const monthPrevBtn = document.getElementById('monthPrevBtn');
  const monthNextBtn = document.getElementById('monthNextBtn');

  let viewedMonth = new Date();
  viewedMonth.setDate(1);

  function keyForDate(d) {
    return `pushups_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function renderHistoryGrid() {
    const year = viewedMonth.getFullYear();
    const month = viewedMonth.getMonth();
    historyMonthLabel.textContent = viewedMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

    const firstDay = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const startOffset = (firstDay.getDay() + 6) % 7; // Monday-first

    historyGrid.innerHTML = '';

    for (let i = 0; i < startOffset; i++) {
      const filler = document.createElement('div');
      filler.className = 'history-day empty';
      historyGrid.appendChild(filler);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const d = new Date(year, month, day);
      const raw = localStorage.getItem(keyForDate(d));
      const val = raw ? parseInt(raw, 10) : 0;
      const pct = Math.min(100, (val / DAILY_GOAL) * 100);

      const cell = document.createElement('div');
      cell.className = 'history-day';
      cell.innerHTML = `
        <div class="history-day-num">${day}</div>
        <div class="history-bar-track"><div class="history-bar-fill" style="height:${pct}%"></div></div>
        <div class="history-day-count">${val}</div>
      `;
      historyGrid.appendChild(cell);
    }
  }

  historyBtn.addEventListener('click', () => {
    viewedMonth = new Date();
    viewedMonth.setDate(1);
    renderHistoryGrid();
    historyOverlay.classList.add('show');
  });
  historyCloseBtn.addEventListener('click', () => historyOverlay.classList.remove('show'));
  historyOverlay.addEventListener('click', (e) => {
    if (e.target === historyOverlay) historyOverlay.classList.remove('show');
  });
  monthPrevBtn.addEventListener('click', () => {
    viewedMonth.setMonth(viewedMonth.getMonth() - 1);
    renderHistoryGrid();
  });
  monthNextBtn.addEventListener('click', () => {
    viewedMonth.setMonth(viewedMonth.getMonth() + 1);
    renderHistoryGrid();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>

</body>
</html>
